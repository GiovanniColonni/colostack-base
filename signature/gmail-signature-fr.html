<!--
  Colostack — Gmail signature (French number)

  Install (no hosting needed — colostack.dev is still a parking page):
    1. Open this file in Chrome, press Cmd+A then Cmd+C.
    2. Gmail → Settings → See all settings → General → Signature → Create new → paste (Cmd+V).
       The logo will show as a broken image for now; that's expected.
    3. Click the broken image once to select it, then click the "Insert image" icon in the
       signature toolbar → Upload → pick signature/colostack-icon-email-84.png.
       If a size menu appears under the image, choose "Original size".
    4. Set "For new emails use" / "On reply/forward use", then Save Changes.

  Later, once colostack.dev is live: upload signature/colostack-icon-email.png to
  https://colostack.dev/colostack-icon-email.png and the <img src> below will work as-is
  (then steps 1-2 are enough). Gmail only keeps inline styles, so this is a table with inline CSS.
-->
